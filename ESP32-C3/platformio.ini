; ============================================================================
;  8adge BLE firmware - ESP32-C3-SuperMini + 3.98" 4-color e-paper (A1).
;
;  Self-contained BLE-only build: no WiFi, no captive portal, no HTTP, no OTA,
;  no server, no filesystem. The phone talks to the panel over Bluetooth LE and
;  sends a finished image; see docs/BLE_PROTOCOL.md for the wire format and the
;  Android-side checklist. Everything it needs is inside this folder, including
;  the hint-screen font source (assets/fonts) and the generated glyph table
;  (src/ble_font.h).;
;  Driver: src/epd_398_4color.{h,cpp} - JD79665 register sequence + this panel's
;  600-line interleaved gate addressing.
;
;  Board: ESP32-C3-SuperMini (4MB flash, no PSRAM) -> board = esp32-c3-devkitm-1
;         PlatformIO has no dedicated SuperMini board definition; devkitm-1 has
;         identical flash/RAM settings and is the usual stand-in.
;         Wiring: DIN->6 SCK->4 DC->1 CS->7 RST->2 BUSY->10, BOOT button (GPIO9).
;
;  Build:   pio run
;  Upload:  pio run -t upload
;  Monitor: pio device monitor      (115200 baud)
;
;  A merged image (bootloader + partition table + app, flashed at 0x0) is
;  produced automatically by merge_firmware.py into .pio/build/<env>/ and copied
;  to bin/8adge_BLE_398_A1.bin.
; ============================================================================
[platformio]
default_envs = ble_398_a1_c3_supermini

[env:ble_398_a1_c3_supermini]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
; The framework's SDK is built for 80 MHz flash (CONFIG_ESPTOOLPY_FLASHFREQ_80M).
; The board manifest defaults to 40 MHz; align the merged image with the SDK so
; merge_firmware.py does not patch a different frequency into the bootloader
; header.
board_build.f_flash = 80000000L
monitor_speed = 115200
; app0 is 0x1E0000 (1.87 MB) here, which is what the merged image is laid out
; for. No filesystem is mounted (the spiffs partition in this table is unused):
; the only flash this build ever writes is one 16-byte NVS record holding the
; time of the last panel refresh, so the 180 s anti-ghosting cooldown survives a
; power cut. The nvs partition below is what makes that possible.
board_build.partitions = min_spiffs.csv
extra_scripts = post:merge_firmware.py
lib_deps =
    ; Pinned: 1.4.x is the line that supports Arduino-ESP32 2.0.x (this project's
    ; core is 3.20017 = 2.0.17). NimBLE replaces the built-in Bluedroid stack and
    ; is roughly 400 KB smaller in flash, which is what keeps this build
    ; comfortably inside the partition.
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; NOTE: there used to be -DEPD_WIDTH/-DEPD_HEIGHT/-DEPD_BPP here. They configured
; nothing: the driver reads EPD398_* from src/epd_398_4color.h, and those three
; names only ever existed as a second (identical) copy of the geometry in
; config.h. The single source is src/epd_398_4color.h, and the canvas/panel
; relation is asserted at compile time in src/ble_geometry.h.
