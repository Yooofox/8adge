; ============================================================================
;  8adge BLE 固件 - ESP32-C3-SuperMini + 3.98 英寸 4 色墨水屏（A1）。
;
;  自包含的纯 BLE 构建：没有 WiFi、没有强制门户、没有 HTTP、没有 OTA，
;  没有服务器、没有文件系统。手机通过蓝牙 LE 与面板通信并
;  发送一张成图；线格式和 Android 端检查清单见 docs/BLE_PROTOCOL.md。
;  它所需的一切都在本文件夹内，包括
;  提示屏字体源文件（assets/fonts）和生成的字形表
;  （src/ble_font.h）。
;  驱动：src/epd_398_4color.{h,cpp} - JD79665 寄存器序列 + 本面板的
;  600 行交错栅极线寻址。
;
;  开发板：ESP32-C3-SuperMini（4MB flash，无 PSRAM）-> board = esp32-c3-devkitm-1
;         PlatformIO 没有专门的 SuperMini 板级定义；devkitm-1 的
;         flash/RAM 设置完全相同，是常用的替代方案。
;         接线：DIN->6 SCK->4 DC->1 CS->7 RST->2 BUSY->10，BOOT 按钮（GPIO9）。
;
;  构建：   pio run
;  上传：   pio run -t upload
;  监视：   pio device monitor      (115200 baud)
;
;  合并镜像（bootloader + 分区表 + app，在 0x0 处烧录）由 merge_firmware.py
;  自动生成到 .pio/build/<env>/ 并复制
;  到 bin/8adge_BLE_398_A1.bin。
; ============================================================================
[platformio]
default_envs = ble_398_a1_c3_supermini

[env:ble_398_a1_c3_supermini]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
; 该框架的 SDK 是按 80 MHz flash 构建的（CONFIG_ESPTOOLPY_FLASHFREQ_80M）。
; 板级清单默认是 40 MHz；要让合并镜像与 SDK 对齐，这样
; merge_firmware.py 就不会把另一种频率写进 bootloader
; 头部。
board_build.f_flash = 80000000L
monitor_speed = 115200
; 这里的 app0 是 0x1E0000（1.87 MB），合并镜像正是按这个布局制作的。
; 没有挂载任何文件系统（此表中的 spiffs 分区未被使用）：
; 本次构建唯一会写入的 flash 是一条 16 字节的 NVS 记录，保存
; 上一次面板刷新的时间，从而让 180 s 的抗残影冷却
; 在断电后依然有效。下面这个 nvs 分区正是实现这一点的关键。
board_build.partitions = min_spiffs.csv
extra_scripts = post:merge_firmware.py
lib_deps =
    ; 版本已固定：1.4.x 是支持 Arduino-ESP32 2.0.x 的那条线（本项目的
        ; 内核是 3.20017 = 2.0.17）。NimBLE 取代了内置的 Bluedroid 协议栈，
        ; flash 占用大约小 400 KB，这正是让本次构建
        ; 能宽裕地放进分区的原因。
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; 注意：这里曾经有过 -DEPD_WIDTH/-DEPD_HEIGHT/-DEPD_BPP。它们什么也没有配置：
; 驱动是从 src/epd_398_4color.h 读取 EPD398_* 的，而那三个
; 名字只是在 config.h 中作为几何参数的第二份（完全相同的）副本存在过。
; 唯一来源是 src/epd_398_4color.h，画布/面板的
; 关系在 src/ble_geometry.h 中于编译期被断言。